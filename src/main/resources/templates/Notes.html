<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Notes · CollabNote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/collabnote.css"/>
    <script src="/js/theme.js"></script>
</head>
<body>
<div class="app-shell">
    <main class="main-content">
        <header class="page-top">
            <div><p class="eyebrow">Your private space</p><h1 id="greeting-line1">Welcome!</h1><p class="page-subtitle" id="greeting-line2">Capture your thoughts, organize your mind.</p></div>
            <div style="display:flex; gap:14px; align-items:center;">
              <div class="theme-toggle" aria-label="Choose color theme">
              <button type="button" data-theme-choice="light" onclick="setTheme('light')" aria-label="Light mode">☼</button>
              <button type="button" data-theme-choice="dark" onclick="setTheme('dark')" aria-label="Dark mode">☾</button>
              </div>
              <a class="button" href="/my-notes/create">＋ New note</a>
              <form action="/logout" method="post" style="margin:0;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="button button-secondary">Logout</button>
              </form>
            </div>
        </header>

        <form action="/my-notes" method="get" class="search-row">
            <label class="search-field"><input type="text" name="keyword" th:value="${keyword}" placeholder="Search your notes" aria-label="Search notes"/></label>
            <button class="button" type="submit">Search</button>
            <a class="button button-secondary" href="/my-notes">Clear</a>
        </form>
        <div class="tag-filters"><a class="tag-filter active" href="/my-notes">All notes</a><span class="tag-filter">⌑ work</span><span class="tag-filter">⌑ ideas</span><span class="tag-filter">⌑ reading</span></div>

        <p th:if="${keyword != null and !keyword.isEmpty()}" class="page-subtitle" style="margin-bottom:18px;" th:text="${'Results for “' + keyword + '”'}"></p>
        <section th:if="${notes.isEmpty()}" class="empty-state"><p>You have no notes yet.</p><a class="button" href="/my-notes/create">Write your first note</a></section>
        <section th:if="${!notes.isEmpty()}" class="note-grid">
            <article th:each="note : ${notes}" class="note-card">
                <a class="note-card-link" th:href="@{/my-notes/{id}(id=${note.id})}">
                    <h2 class="note-title" th:text="${note.title}"></h2>
                    <p class="note-content" th:text="${note.content}"></p>
                    <div class="note-tags" th:if="${!note.tags.isEmpty()}"><span class="tag" th:each="tag : ${note.tags}" th:text="${'#' + tag}"></span></div>
                </a>
                <footer class="note-card-footer">
                    <span th:text="${#temporals.format(note.updatedAt != null ? note.updatedAt : note.createdAt, 'MMM d, yyyy · HH:mm')}"></span>
                    <span class="note-actions"><a class="icon-link" th:href="@{/my-notes/edit/{id}(id=${note.id})}" title="Edit note">✎</a><a class="icon-link" th:href="@{/my-notes/{id}/history(id=${note.id})}" title="Version history">◷</a><form th:action="@{/my-notes/delete/{id}(id=${note.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="icon-button" type="submit" onclick="return confirm('Delete this note?')" title="Delete note">×</button></form></span>
                </footer>
            </article>
        </section>
    </main>
</div>
<script>
    // AI Greeting
    fetch('/api/ai/greeting')
        .then(response => response.text())
        .then(greeting => {
            const lines = greeting.split('\n');
            if (lines.length >= 2) {
                document.getElementById('greeting-line1').textContent = lines[0].trim();
                document.getElementById('greeting-line2').textContent = lines[1].trim();
            }
        })
        .catch(() => {
            // Keep default text on error
        });
</script>
</body>
</html>
