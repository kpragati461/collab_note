<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>History · CollabNote</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/css/collabnote.css"/><script src="/js/theme.js"></script></head><body><main class="main-content"><div class="history-wrap"><header class="page-top"><a class="brand" href="/my-notes"><span class="brand-mark">✦</span>CollabNote</a><div style="display:flex;gap:12px;align-items:center"><div class="theme-toggle"><button type="button" data-theme-choice="light" onclick="setTheme('light')">☼</button><button type="button" data-theme-choice="dark" onclick="setTheme('dark')">☾</button></div><a class="button button-secondary" th:href="@{/my-notes/{id}(id=${note.id})}">Back to note</a></div></header><section class="history-card"><p class="eyebrow">Nothing is lost</p><h1>Version history</h1><p class="page-subtitle" th:text="${note.title}"></p><div class="history-list" style="margin-top:30px"><p th:if="${versions.isEmpty()}" class="page-subtitle">No saved versions yet.</p><article class="version-item" th:each="version : ${versions}"><div class="version-head"><div><h2 class="version-title" th:text="${'Version ' + version.versionNumber}"></h2><p class="version-meta" th:text="${#temporals.format(version.savedAt, 'MMM d, yyyy · HH:mm:ss')}"></p></div><form th:action="@{/my-notes/{noteId}/history/{versionId}/restore(noteId=${note.id}, versionId=${version.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="button button-secondary" type="submit">Restore</button></form></div><div class="note-tags" th:if="${version.tagsText != null and !version.tagsText.isBlank()}"><span class="tag" th:text="${'#' + #strings.replace(version.tagsText, ', ', ' #')}"></span></div><p class="version-content" th:text="${version.content}"></p></article></div></section></div></main></body></html>
