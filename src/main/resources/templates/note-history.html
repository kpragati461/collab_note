<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Note History - NotesApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #F0EBFF; font-family: 'Inter', sans-serif; color: #1a1a2e; }
        nav { background: linear-gradient(135deg, #6C3EF4, #FF6B6B); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .brand, .back { color: #fff; text-decoration: none; font-family: 'Poppins', sans-serif; font-weight: 700; }
        .back { border: 1px solid rgba(255,255,255,.4); border-radius: 20px; padding: 8px 16px; font-size: 13px; }
        main { max-width: 820px; margin: 2rem auto; padding: 0 1.5rem; }
        h1 { font-family: 'Poppins', sans-serif; margin-bottom: .25rem; }
        .subtitle { color: #777; margin-bottom: 1.5rem; }
        .version { background: #fff; border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; }
        .version-head { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
        .version h2 { font: 600 17px 'Poppins', sans-serif; margin: 0; }
        .time { color: #888; font-size: 13px; }
        .tags { color: #6C3EF4; font-size: 13px; margin-top: .65rem; }
        .content { white-space: pre-wrap; line-height: 1.6; color: #444; margin: .75rem 0; }
        button { border: 0; border-radius: 9px; background: #6C3EF4; color: #fff; padding: 8px 13px; font-weight: 600; cursor: pointer; }
        .empty { background: #fff; padding: 2rem; border-radius: 16px; color: #777; }
    </style>
</head>
<body>
<nav>
    <a class="brand" href="/my-notes">NotesApp</a>
    <a class="back" th:href="@{/my-notes/edit/{id}(id=${note.id})}">Back to Note</a>
</nav>
<main>
    <h1>Version History</h1>
    <p class="subtitle" th:text="${note.title}"></p>
    <div th:if="${versions.isEmpty()}" class="empty">No saved versions yet.</div>
    <article class="version" th:each="version : ${versions}">
        <div class="version-head">
            <div>
                <h2 th:text="${'Version ' + version.versionNumber + ' · ' + version.title}"></h2>
                <div class="time" th:text="${#temporals.format(version.savedAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
            </div>
            <form th:action="@{/my-notes/{noteId}/history/{versionId}/restore(noteId=${note.id}, versionId=${version.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">Restore this version</button>
            </form>
        </div>
        <div class="tags" th:if="${version.tagsText != null and !version.tagsText.isBlank()}" th:text="${'#' + #strings.replace(version.tagsText, ', ', ' #')}"></div>
        <div class="content" th:text="${version.content}"></div>
    </article>
</main>
</body>
</html>
