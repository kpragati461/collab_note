<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>New Note · CollabNote</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/css/collabnote.css"/><script src="/js/theme.js"></script></head><body><main class="main-content"><div class="form-wrap"><header class="page-top"><a class="brand" href="/my-notes"><span class="brand-mark">✦</span>CollabNote</a><div class="theme-toggle"><button type="button" data-theme-choice="light" onclick="setTheme('light')">☼</button><button type="button" data-theme-choice="dark" onclick="setTheme('dark')">☾</button></div></header><section class="form-card"><p class="eyebrow">A fresh page</p><h1>Write a note</h1><p class="page-subtitle">Give your thoughts room to settle.</p><form th:action="@{/my-notes/create}" th:object="${note}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><div class="field"><label for="title">Title</label><input id="title" type="text" th:field="*{title}" placeholder="What is on your mind?"/><span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-text"></span></div><div class="field"><label for="content">Your note</label><textarea id="content" th:field="*{content}" placeholder="Start writing…"></textarea><span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="error-text"></span></div><div class="field"><label for="tagsInput">Tags</label><input id="tagsInput" type="text" th:field="*{tagsInput}" placeholder="work, ideas, reading"/><p class="help-text">Separate tags with commas.</p></div><div class="field"><label for="attachments">Pictures or videos</label><input id="attachments" type="file" name="attachments" accept="image/*,video/*" multiple/><p class="help-text">Add one or more images or videos, up to 50 MB each.</p></div><div class="form-actions"><a class="button button-secondary" href="/my-notes">Cancel</a><button class="button" type="submit">Save note</button></div></form></section></div></main></body></html>
