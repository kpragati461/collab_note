<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Create account · CollabNote</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/css/collabnote.css"/><script src="/js/theme.js"></script></head><body class="auth-page"><section class="auth-card"><div style="display:flex;justify-content:space-between;align-items:center"><a class="brand" href="/login"><span class="brand-mark">✦</span>CollabNote</a><div class="theme-toggle"><button type="button" data-theme-choice="light" onclick="setTheme('light')">☼</button><button type="button" data-theme-choice="dark" onclick="setTheme('dark')">☾</button></div></div><p class="eyebrow">Begin gently</p><h1>Make space for your ideas.</h1><p class="page-subtitle">Create your private CollabNote account.</p><nav class="auth-tabs"><a href="/login">Sign in</a><a class="active" href="/register">Create account</a></nav><form action="/register" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><div class="field"><label>Username</label><input type="text" name="username" placeholder="Choose a username" required/></div><div class="field"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required/></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required/></div><div class="form-actions"><button class="button" type="submit">Create account</button></div></form></section></body></html>
